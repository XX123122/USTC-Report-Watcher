[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ustc-report-watcher"
version = "0.1.0"
description = "Windows local USTC academic report watcher"
requires-python = ">=3.11"
dependencies = ["playwright>=1.51,<2", "PyYAML>=6,<7", "tzdata"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ustc-report-watcher = "ustc_report_watcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
